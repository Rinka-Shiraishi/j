name: Preserve upstream source (Git bundle)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-upstream.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-upstream
  cancel-in-progress: false

jobs:
  archive:
    name: Store restorable Git history snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: storytold/pdfcraft
      DEST_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch upstream and publish a permanent snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          # A Git bundle preserves original commits, tags and workflow files without
          # attempting to push upstream GitHub Actions workflow commits as Git refs.
          git clone --mirror "https://github.com/${SOURCE_REPO}.git" source.git

          ref_list="$(git -C source.git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | LC_ALL=C sort)"
          if [[ -z "${ref_list}" ]]; then
            echo "::error::No upstream Git refs found; existing releases are preserved"
            exit 1
          fi

          fingerprint="$(printf '%s\n' "${ref_list}" | sha256sum | cut -c1-20)"
          snapshot="snapshot-${fingerprint}"
          if gh release view "${snapshot}" --repo "${DEST_REPO}" >/dev/null 2>&1; then
            echo "No upstream ref changes since previously captured ${snapshot}; existing snapshot is retained."
            exit 0
          fi

          git -C source.git bundle create "../upstream.bundle" --all
          git -C source.git bundle verify "../upstream.bundle"

          printf 'Upstream: https://github.com/%s\nRef fingerprint: %s\nSnapshot created: %s\n\nRestoration:\n  git clone upstream.bundle restored-project\n\nThis bundle contains upstream Git branches, tags and history. Git LFS objects and GitHub Release assets are not included.\n' "${SOURCE_REPO}" "${fingerprint}" "$(date -u +%FT%TZ)" > SNAPSHOT.txt

          # The workflow token has contents:write, enough for release assets.
          # Unlike a Git push of source commits, this does not need workflows scope.
          gh release create "${snapshot}" upstream.bundle SNAPSHOT.txt \
            --repo "${DEST_REPO}" --target main \
            --title "Upstream Git history ${fingerprint}" \
            --notes "Immutable Git bundle snapshot of https://github.com/${SOURCE_REPO}; captured ref fingerprint ${fingerprint}. Download upstream.bundle to restore original branches and history."

          echo "Saved new independent restore point: ${snapshot}"
      - name: Keep only the two newest valid archive snapshots
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          # Delete only our own historical snapshot Releases, never other releases.
          # Retention is skipped if cloning or publishing the new archive failed.
          gh release list --repo "${DEST_REPO}" --limit 1000 \
            --json tagName,publishedAt,isDraft > releases.json
          jq -r '[.[] | select((.isDraft | not) and (.tagName | test("^snapshot-[0-9a-f]{20}$")))] | sort_by(.publishedAt) | reverse | .[].tagName' \
            releases.json > snapshots.txt
          mapfile -t snapshots < snapshots.txt
          if (( ${#snapshots[@]} <= 2 )); then
            echo "Keeping ${#snapshots[@]} snapshot(s); nothing to prune."
            exit 0
          fi

          # Check BOTH survivors still have complete, nonempty restorable bundle assets.
          # If either snapshot appears incomplete, leave every older backup untouched.
          for tag in "${snapshots[@]:0:2}"; do
            count="$(gh api "repos/${DEST_REPO}/releases/tags/${tag}" \
              --jq '[.assets[] | select(.name == "upstream.bundle" and .size > 0)] | length')"
            if [[ "${count}" != "1" ]]; then
              echo "::error::Snapshot ${tag} has no valid Git bundle. No archives deleted."
              exit 1
            fi
          done

          for tag in "${snapshots[@]:2}"; do
            echo "Pruning older verified snapshot: ${tag}"
            gh release delete "${tag}" --repo "${DEST_REPO}" --cleanup-tag --yes
          done
          echo 'Archive retention complete: latest two snapshots kept.'
